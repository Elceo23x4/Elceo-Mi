name: CI Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elceo
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: elceo_ifp3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elceo -d elceo_ifp3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Activate npm 10.8.2
        run: npm install --global npm@10.8.2
      - name: Runtime version evidence
        run: |
          node --version
          npm --version
          npm run check:runtime
      - name: Deterministic dependency installation
        run: npm ci
      - name: Dependency security and tree evidence
        run: |
          npm audit --json
          npm ls --all --json
          npm ls minimatch brace-expansion sharp --all
          npm explain minimatch
          npm explain brace-expansion
          npm explain sharp
          npm explain next
          npm explain next-auth
          npm run check:dependency-compatibility
          npm run check:sharp-exception-upstream
          npm run audit:image-ingress
      - name: Typecheck
        run: npm run typecheck
      - name: Repository tests
        run: npm run test
      - name: Provider API Gate Redis integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:provider-control-redis
      - name: Provider Cache and Single-Flight Redis integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:provider-cache-redis
      - name: Provider Resilience Redis integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:provider-resilience-redis
      - name: Adaptive Materialization Redis integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:adaptive-materialization-redis
      - name: Adaptive Materialization Redis and PostgreSQL integration
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:adaptive-materialization-integration
      - name: D1-B Dashboard Projection PostgreSQL and Redis acceptance
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:dashboard-projection-materialization-integration
      - name: D1-C Passive Production Consumer acceptance
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:d1c-passive-dashboard-consumer
      - name: Canonical Dashboard 12-Asset End-to-End acceptance
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:canonical-dashboard-12-asset-acceptance
      - name: PGS-5 scale economics acceptance
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:provider-scale-acceptance
      - name: Canonical Candle PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:canonical-candle-postgres
      - name: IFP-3 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp3-postgres
      - name: IFP-4 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp4-postgres
      - name: IFP-5 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp5-postgres
      - name: IFP-6 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp6-postgres
      - name: IFP-7 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp7-postgres
      - name: IFP-8 PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:ifp8-postgres
      - name: Backend authority PostgreSQL acceptance
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:backend-authority-postgres
      - name: SEC-A1 cross-tenant authority PostgreSQL acceptance
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:sec-a1-postgres
      - name: Kick Off dashboard acceptance
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:kick-off-acceptance
      - name: Production build
        run: npm run build
      - name: Notification browser bundle secret boundary
        env:
          RESEND_API_KEY: rc_i3_client_secret_sentinel_resend_api_key
          RESEND_WEBHOOK_SECRET: rc_i3_client_secret_sentinel_resend_webhook_secret
          POSTMARK_SERVER_TOKEN: rc_i3_client_secret_sentinel_postmark_server_token
          POSTMARK_WEBHOOK_USERNAME: rc_i3_client_secret_sentinel_postmark_webhook_username
          POSTMARK_WEBHOOK_PASSWORD: rc_i3_client_secret_sentinel_postmark_webhook_password
          ONESIGNAL_APP_API_KEY: rc_i3_client_secret_sentinel_onesignal_app_api_key
          ONESIGNAL_REST_API_KEY: rc_i3_client_secret_sentinel_onesignal_rest_api_key
          ONESIGNAL_WEBHOOK_CORRELATION_SECRET: rc_i3_client_secret_sentinel_onesignal_webhook_correlation_secret
          DATABASE_URL: postgresql://rc_i3_client_secret_sentinel_database_url@localhost/rc_i3
          AUTH_SECRET: rc_i3_client_secret_sentinel_auth_secret
        run: npm run -w apps/web build && npm run security:notification-client
      - name: RC-I3 notification provider PostgreSQL integration
        env:
          DATABASE_URL: postgresql://elceo@127.0.0.1:5432/elceo_ifp3
        run: npm run test:notification-provider-integration
      - name: Native sharp runtime
        run: npm run test:sharp
      - name: SVG transformation pipeline
        run: npm run test:svg
      - name: Next.js production image optimizer
        run: npm run test:next-image
      - name: Next.js image optimizer concurrency
        run: npm run test:next-image-concurrency
      - name: Release-scoped workspace lint
        run: |
          npm run -w @elceo/application-state lint
          npm run -w @elceo/analytics lint
          npm run -w @elceo/reasoning lint
          npm run -w @elceo/notifications lint
          npm run -w apps/web lint
      - name: Migration validation
        run: npm run check:migrations
      - name: C5 readiness
        run: npm run check:c5-readiness
      - name: Infrastructure security validation
        run: npm run check:infra-security
      - name: Check Intelligence Feature Program contract
        run: npm run check:ifp
      - name: Strengthened security gate
        run: npm run security:gate
      - name: Complete release gate
        run: npm run release:gate
      - name: Verify clean working tree
        run: |
          git diff --exit-code
          node scripts/verify-clean-working-tree.mjs
      - name: Diff integrity validation
        run: |
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
          test -z "$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD | awk '$1 == "-" || $2 == "-"')"
          ! git diff --binary "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD | grep -q 'GIT binary'' patch'
          test -z "$(git status --short)"

  postgres-r2-backup-image:
    name: PostgreSQL R2 backup image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell and mock validation
        run: |
          bash -n ops/postgres-r2-backup/backup.sh ops/postgres-r2-backup/test.sh
          ops/postgres-r2-backup/test.sh
          git diff --check
      - name: Build worker image
        run: docker build --tag elceo-postgres-r2-backup:test ops/postgres-r2-backup
      - name: Verify runtime binaries and non-root user
        run: |
          test "$(docker run --rm --entrypoint pg_dump elceo-postgres-r2-backup:test --version | awk '{print $3}')" = "18.6"
          test "$(docker run --rm --entrypoint pg_restore elceo-postgres-r2-backup:test --version | awk '{print $3}')" = "18.6"
          docker run --rm --entrypoint rclone elceo-postgres-r2-backup:test version | grep -F 'rclone v1.75.0'
          test "$(docker run --rm --entrypoint id elceo-postgres-r2-backup:test -u)" != "0"
          docker run --rm --entrypoint sh elceo-postgres-r2-backup:test -c \
            'test -s /etc/ssl/certs/ca-certificates.crt; test -r /etc/ssl/certs/ca-certificates.crt; ! command -v curl; ! command -v unzip; test "$(id -u)" != 0; workdir=$(mktemp -d); test -d "$workdir"; rm -rf "$workdir"'
      - name: Verify worker startup contract
        run: |
          if docker run --rm elceo-postgres-r2-backup:test >worker.log 2>&1; then
            echo 'worker unexpectedly accepted missing runtime variables' >&2
            exit 1
          fi
          grep -F 'error=missing_required_environment variable=BACKUP_RUN_MODE' worker.log
          ! grep -F 'Permission denied' worker.log

  postgres-r2-restore-rehearsal-image:
    name: PostgreSQL R2 restore rehearsal image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell and mock validation
        run: |
          bash -n ops/postgres-r2-restore-rehearsal/restore.sh ops/postgres-r2-restore-rehearsal/test.sh
          ops/postgres-r2-restore-rehearsal/test.sh
          git diff --check
      - name: Build worker image
        run: docker build --tag elceo-postgres-r2-restore-rehearsal:test ops/postgres-r2-restore-rehearsal
      - name: Verify minimal non-root runtime
        run: |
          test "$(docker run --rm --entrypoint psql elceo-postgres-r2-restore-rehearsal:test --version | awk '{print $3}')" = "18.6"
          test "$(docker run --rm --entrypoint pg_restore elceo-postgres-r2-restore-rehearsal:test --version | awk '{print $3}')" = "18.6"
          docker run --rm --entrypoint rclone elceo-postgres-r2-restore-rehearsal:test version | grep -F 'rclone v1.75.0'
          test "$(docker run --rm --entrypoint id elceo-postgres-r2-restore-rehearsal:test -u)" != "0"
          docker run --rm --entrypoint sh elceo-postgres-r2-restore-rehearsal:test -c 'test -s /etc/ssl/certs/ca-certificates.crt; test -r /etc/ssl/certs/ca-certificates.crt; command -v jq; ! command -v curl; ! command -v unzip'
      - name: Verify confirmation gate in final container
        run: |
          if docker run --rm elceo-postgres-r2-restore-rehearsal:test >missing.log 2>&1; then exit 1; fi
          grep -F 'error=restore_confirmation_required' missing.log
          ! grep -Eq 'Permission denied|not found' missing.log
          if docker run --rm -e RESTORE_CONFIRMATION=WRONG elceo-postgres-r2-restore-rehearsal:test >incorrect.log 2>&1; then exit 1; fi
          grep -F 'error=restore_confirmation_required' incorrect.log
          ! grep -Eq 'Permission denied|not found' incorrect.log
