name: UI Handoff Diff Integrity Diagnostic

on:
  push:
    branches:
      - codex/backend-freeze-ui-handoff

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose each diff-integrity assertion
        shell: bash
        run: |
          set +e
          BASE=20266494efd3a8d3a97c3ea9335c672e20fe7fa5
          failed=0

          echo '=== ASSERTION 1: git diff --check ==='
          git diff --check "$BASE" HEAD
          rc=$?
          echo "ASSERTION_1_EXIT=$rc"
          if [ "$rc" -ne 0 ]; then failed=1; fi

          echo '=== ASSERTION 2: binary numstat ==='
          binary_numstat="$(git diff --numstat "$BASE" HEAD | awk '$1 == "-" || $2 == "-"')"
          printf '%s\n' "$binary_numstat"
          if [ -n "$binary_numstat" ]; then
            echo 'ASSERTION_2_EXIT=1'
            failed=1
          else
            echo 'ASSERTION_2_EXIT=0'
          fi

          echo '=== ASSERTION 3: binary patch markers ==='
          if git diff --binary "$BASE" HEAD | grep -n 'GIT binary patch'; then
            echo 'ASSERTION_3_EXIT=1'
            failed=1
          else
            echo 'ASSERTION_3_EXIT=0'
          fi

          echo '=== ASSERTION 4: working tree status ==='
          git status --short
          status_output="$(git status --short)"
          if [ -n "$status_output" ]; then
            echo 'ASSERTION_4_EXIT=1'
            failed=1
          else
            echo 'ASSERTION_4_EXIT=0'
          fi

          echo "DIAGNOSTIC_FAILURE=$failed"
          exit "$failed"
