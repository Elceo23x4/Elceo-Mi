<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELCEO Frozen API Explorer</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b0b0b;color:#f4f4f4}header{position:sticky;top:0;background:#111;padding:16px;border-bottom:1px solid #333}input,select{padding:10px;margin-right:8px;background:#191919;color:#fff;border:1px solid #444;border-radius:6px}main{padding:18px}.op{border:1px solid #333;border-radius:8px;padding:14px;margin:10px 0;background:#121212}.method{font-weight:700}.meta{color:#bbb;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}.path{font-family:ui-monospace,monospace}pre{white-space:pre-wrap;background:#080808;padding:12px;border-radius:6px;overflow:auto}</style></head><body><header><strong>ELCEO Frozen API Explorer</strong><div style="margin-top:10px"><input id="q" placeholder="Search path/method"><select id="exposure"><option value="">All exposures</option><option>user_ui</option><option>admin_ui</option><option>super_admin_ui</option><option>server_internal</option><option>framework</option></select></div></header><main><p id="status">Loading OpenAPI contract…</p><div id="list"></div></main><script>
const q=document.querySelector('#q'),exposure=document.querySelector('#exposure'),list=document.querySelector('#list'),status=document.querySelector('#status');let rows=[];
function render(){const s=q.value.toLowerCase(),e=exposure.value;list.innerHTML='';const visible=rows.filter(r=>(!s||(`${r.method} ${r.path}`).toLowerCase().includes(s))&&(!e||r.exposure===e));status.textContent=`${visible.length} operations shown / ${rows.length} total`;for(const r of visible){const el=document.createElement('section');el.className='op';el.innerHTML=`<div><span class="method">${r.method}</span> <span class="path">${r.path}</span></div><div class="meta"><span>exposure: ${r.exposure}</span><span>policy: ${r.policy}</span><span>entitlement: ${r.entitlement}</span><span>permission: ${r.permission}</span></div><details><summary>Contract metadata</summary><pre>${escapeHtml(JSON.stringify(r.operation,null,2))}</pre></details>`;list.appendChild(el)}}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
fetch('../../artifacts/ui-handoff/openapi.json').then(r=>r.json()).then(api=>{for(const [path,ops] of Object.entries(api.paths||{}))for(const [method,operation] of Object.entries(ops))rows.push({path,method:method.toUpperCase(),operation,exposure:operation['x-elceo-ui-exposure']||'',policy:operation['x-elceo-policy']||'',entitlement:operation['x-elceo-entitlement']||'',permission:operation['x-elceo-permission']||''});rows.sort((a,b)=>(a.path+a.method).localeCompare(b.path+b.method));render()}).catch(err=>status.textContent=`Could not load OpenAPI JSON. Serve the repository root over a local HTTP server and reopen this page. ${err}`);q.addEventListener('input',render);exposure.addEventListener('change',render);
</script></body></html>
